services:
  roonserver:
    container_name: roonserver
    image: gz1903/roonserver:latest
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Chicago
    volumes:
      - /mnt/cell_block_d/apps/roon/app:/app
      - /mnt/cell_block_d/apps/roon/data:/data
      - /mnt/cell_block_d/media/audio/music:/music:ro
      - /mnt/cell_block_d/apps/roon/backups:/backup
    healthcheck:
      # Roon has no HTTP API — check the main process is alive
      test: ["CMD-SHELL", "pgrep -f RoonServer > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
