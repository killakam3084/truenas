# TrueNAS SCALE logging stack — Loki + Promtail.
# No secrets required.
#
# First-run prerequisite (run once on host):
#   mkdir -p /mnt/cell_block_d/apps/loki/data
#
# After deploying, add a Loki datasource in Grafana:
#   URL: http://192.168.68.60:3100

services:
  loki:
    container_name: loki
    image: grafana/loki:3.4
    user: "0"
    network_mode: host
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - /mnt/cell_block_d/repos/truenas/logging/loki-config.yml:/etc/loki/config.yml:ro
      - /mnt/cell_block_d/apps/loki/data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  promtail:
    container_name: promtail
    image: grafana/promtail:3.4
    network_mode: host
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /mnt/cell_block_d/repos/truenas/logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /mnt/cell_block_d/apps/nginx-proxy/logs:/var/log/nginx:ro
